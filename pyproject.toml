[project]
name = "leap"
dynamic = ["version"]
requires-python = ">=3.10"
description = "ME_U0 map-style post-training and evaluation for LIBERO and RoboDojo"
maintainers = [
    {name = "Wenfu Wang"},
]

dependencies = [
    "transformers>=4.57,<5.10",
    "huggingface-hub>=1.3.0",
    "accelerate>=0.30",
    "safetensors",
    "omegaconf",
    "tensorboard",
    "torch>=2.2,<2.9",
    "torchvision",
    "deepspeed>=0.14,<0.19",
    "datasets>=4.0,<4.8.5",
    "torchcodec>=0.3,<0.5",
]

[project.optional-dependencies]
# XPolicyLab source is loaded from the pinned RoboDojo checkout via PYTHONPATH,
# but its complete transport/observation dependency set belongs in the NVIDIA
# policy runtime. Isaac Sim and the simulator client remain in a separate py311
# environment and are deliberately not listed here.
xpolicy = [
    "numpy>=1.23,<2",
    "pyyaml>=6,<7",
    "opencv-python-headless>=4.8,<5",
    "h5py>=3.8,<4",
    "websockets>=13,<16",
    "msgpack>=1.0.8,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "pydantic>=2.5,<3",
]
diffusion = ["diffusers>=0.28"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leap*", "sim_eval*"]

[tool.setuptools_scm]
# Version from git tags: `git tag v0.2.0` → version "0.2.0"
# Dev commits after tag: → "0.2.1.dev3+gabcdef"
version_file = "leap/_version.py"
