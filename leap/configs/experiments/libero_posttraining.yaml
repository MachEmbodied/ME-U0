# Post-train the 120M H12 checkpoint on native LIBERO delta-EEF data.
# Keep the 26/26 model heads and group-substep MRoPE. The two real cameras
# use a 128x256 horizontal VAE mosaic; ViT reads the main image at 224x224.
# RGB is sampled at source offsets [0,3,6,9,12], yielding 5 frames.
run_id: ${oc.env:ME_U0_RUN_ID,UNSET_RUN_ID}
work_dir: ${work_root}/${run_id}

defaults:
  - /defaults
  - /trainer: ME_U0
  - /model: ME_U0
  - /data: libero_posttraining_map_style_native_delta_eef_minmax_video_stride3_action_24_view128
  - /distributed: zero2_bf16

posttrain_save_every_n_steps: 5000
posttrain_save_at_fit_end: true

model:
  # Set ME_U0_PRETRAINED_PTH to the completed pretraining weights when ready.
  pretrained_pth: ${oc.env:ME_U0_PRETRAINED_PTH,/path/to/checkpoints/step_N}
  pretrained_strict: true
  action_space_schema_id: null
  action_dim: 26
  state_dim: 26
  action_position_mode: group_substep_mrope
  freeze_understanding: false
  freeze_vit: false
  freeze_vae: true
  action_horizon: 12
  num_video_frames: 5
  num_video_latent_frames: 2
  per_view_size: 128
  main_image_size: 224
  batch_vae_vit_encoders: true

runtime:
  data_style: map_style
  batch_contract: canonical_subtask
  preflight: none
  resume_contract: base

training:
  seed: 42
  max_steps: 50000
  max_epochs: 30
  gradient_accumulation_steps: 1
  gradient_clip_max_norm: 1.0

optimizer:
  type: AdamW
  lr: 5.0e-5
  vit_lr: 5.0e-6
  action_lr: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

scheduler:
  type: cosine_with_warmup
  warmup_steps: 130
  min_lr_ratio: 0.1

callbacks:
  - _target_: leap.callbacks.logging_callback.ExperimentSetupCallback
  - _target_: leap.callbacks.logging_callback.TrainingProgressCallback
    log_interval: 10
  - _target_: leap.callbacks.logging_callback.TensorBoardCallback
  - _target_: leap.callbacks.logging_callback.JsonLogCallback
    log_interval: 10
  - _target_: leap.callbacks.atomic_checkpoint_callback.AtomicCheckpointCallback
    save_every_n_steps: ${posttrain_save_every_n_steps}
    save_every_n_epochs: 0
    max_keep: 10
    save_at_fit_end: ${posttrain_save_at_fit_end}
